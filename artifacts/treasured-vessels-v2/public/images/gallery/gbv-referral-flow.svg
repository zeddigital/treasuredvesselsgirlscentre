<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img"
     aria-label="A discreet referral flow after a disclosure of violence. First, listen and check immediate safety: if she is in immediate danger, that comes before everything else. Second, state the confidentiality limits before she says more. Third, consent: she decides what happens and what is shared. Fourth, refer into the right category, which may be medical care, police and the Child and Family Protection Unit, the district probation and social welfare officer, legal aid, counselling, or a safe place to stay. Fifth, accompany her, including help with the fare. Sixth, follow up to find out whether she was actually seen. Throughout, the detail of what happened stays with the statutory services, and the centre records only consent, destination, category, attendance and what follows. The centre is not a shelter, clinic, legal service, counselling service or child protection authority.">
  <defs>
    <style>
      .h    { font-family: Georgia, 'Times New Roman', serif; fill: #552050; }
      .lead { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; fill: #6b6672; font-size: 17px; }
      .n    { font-family: Georgia, 'Times New Roman', serif; fill: #ffffff; font-size: 17px; }
      .t    { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; fill: #552050; font-size: 14.5px; }
      .d    { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; fill: #25222B; font-size: 12.5px; }
      .urg  { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; fill: #B3123C; font-size: 13px; }
      .cat  { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; fill: #25222B; font-size: 13px; }
      .tag  { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; fill: #552050; font-size: 13px; letter-spacing: 0.06em; }
      .nl   { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; fill: #EBD9E8; font-size: 13px; }
      .nlt  { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; fill: #F1B74B; font-size: 13px; letter-spacing: 0.06em; }
      .foot { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; fill: #6b6672; font-size: 12.5px; }
    </style>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#A33895"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="#FFF8F0"/>

  <text class="h" x="56" y="58" font-size="30">After a disclosure</text>
  <text class="lead" x="56" y="88">Six steps. She decides at every one of them.</text>
  <line x1="56" y1="112" x2="944" y2="112" stroke="#E9DCE6" stroke-width="2"/>

  <!-- steps -->
  <rect x="56" y="144" width="196" height="128" rx="14" fill="#ffffff" stroke="#E9DCE6" stroke-width="2"/>
  <circle cx="86" cy="176" r="13" fill="#A33895"/><text class="n" x="86" y="182" text-anchor="middle">1</text>
  <text class="t" x="108" y="181">Listen, check safety</text>
  <text class="d" x="76" y="214">Believe her. Ask only</text>
  <text class="d" x="76" y="232">whether she is safe</text>
  <text class="d" x="76" y="250">tonight.</text>

  <rect x="271" y="144" width="196" height="128" rx="14" fill="#ffffff" stroke="#E9DCE6" stroke-width="2"/>
  <circle cx="301" cy="176" r="13" fill="#E43F8C"/><text class="n" x="301" y="182" text-anchor="middle">2</text>
  <text class="t" x="323" y="181">State the limits</text>
  <text class="d" x="291" y="214">Who you would have</text>
  <text class="d" x="291" y="232">to tell, before she</text>
  <text class="d" x="291" y="250">says more.</text>

  <rect x="486" y="144" width="196" height="128" rx="14" fill="#ffffff" stroke="#E9DCE6" stroke-width="2"/>
  <circle cx="516" cy="176" r="13" fill="#3DAAE1"/><text class="n" x="516" y="182" text-anchor="middle">3</text>
  <text class="t" x="538" y="181">Consent</text>
  <text class="d" x="506" y="214">She decides what</text>
  <text class="d" x="506" y="232">happens and what is</text>
  <text class="d" x="506" y="250">shared. Or nothing.</text>

  <rect x="701" y="144" width="243" height="128" rx="14" fill="#ffffff" stroke="#A33895" stroke-width="3"/>
  <circle cx="731" cy="176" r="13" fill="#552050"/><text class="n" x="731" y="182" text-anchor="middle">4</text>
  <text class="t" x="753" y="181">Refer to the right service</text>
  <text class="cat" x="721" y="214">Medical &#183; police CFPU &#183; probation</text>
  <text class="cat" x="721" y="234">officer &#183; legal aid &#183; counselling</text>
  <text class="cat" x="721" y="254">&#183; a safe place to stay</text>

  <path d="M257 208 L264 208" stroke="#A33895" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M472 208 L479 208" stroke="#A33895" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M687 208 L694 208" stroke="#A33895" stroke-width="2.5" marker-end="url(#a2)"/>

  <rect x="56" y="300" width="430" height="104" rx="14" fill="#ffffff" stroke="#E9DCE6" stroke-width="2"/>
  <circle cx="86" cy="332" r="13" fill="#F1B74B"/><text class="n" x="86" y="338" text-anchor="middle">5</text>
  <text class="t" x="108" y="337">Accompany her</text>
  <text class="d" x="76" y="370">Sit with her. Help with the fare. Being alone in a</text>
  <text class="d" x="76" y="388">waiting room is where most referrals stop.</text>

  <rect x="514" y="300" width="430" height="104" rx="14" fill="#ffffff" stroke="#E9DCE6" stroke-width="2"/>
  <circle cx="544" cy="332" r="13" fill="#A33895"/><text class="n" x="544" y="338" text-anchor="middle">6</text>
  <text class="t" x="566" y="337">Follow up</text>
  <text class="d" x="534" y="370">Did she actually get seen? A log of what we sent is</text>
  <text class="d" x="534" y="388">a record of our activity, not of her care.</text>

  <!-- urgent note -->
  <rect x="56" y="424" width="430" height="72" rx="14" fill="#ffffff" stroke="#B3123C" stroke-width="2"/>
  <text class="urg" x="82" y="454">IF SHE IS IN IMMEDIATE DANGER</text>
  <text class="d" x="82" y="478">That comes first. Child Helpline 116, or the nearest police CFPU.</text>

  <!-- what stays out -->
  <rect x="514" y="424" width="430" height="72" rx="14" fill="#552050"/>
  <text class="nlt" x="540" y="454">WHAT WE DO NOT RECORD</text>
  <text class="nl" x="540" y="478">The detail of what happened. That stays with statutory services.</text>

  <text class="tag" x="56" y="536">WE ARE NOT A SHELTER, A CLINIC, A LEGAL SERVICE OR A CHILD PROTECTION AUTHORITY</text>
  <text class="foot" x="944" y="576" text-anchor="end">Treasured Vessels Girls&#8217; Centre &#183; treasuredvesselsuganda.org</text>
</svg>

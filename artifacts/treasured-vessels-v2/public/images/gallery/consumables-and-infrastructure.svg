<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img"
     aria-label="The difference between consumables and infrastructure in a school menstrual health budget. Consumables recur every term and include disposable pads for the emergency stock, soap, simple pain relief, replacement reusable kits and bin liners. They need a budget line every term, forever, so a one-off donation solves one term and then stops. Infrastructure is bought once and then maintained, and includes a door and a working latch, a water tank or connection near the latrines, a partition to make a changing space, covered bins, a private drying line, locks and lighting. Infrastructure is the better gift, because a door fitted this year is still a door in five years, whereas a term of pads is gone by Easter. A school can usually carry the consumables once the infrastructure exists, and almost never the other way round.">
  <defs>
    <style>
      .h    { font-family: Georgia, 'Times New Roman', serif; fill: #552050; }
      .lead { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; fill: #6b6672; font-size: 17px; }
      .ct   { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; }
      .sub  { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-style: italic; fill: #6b6672; font-size: 13.5px; }
      .li   { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; fill: #25222B; font-size: 14px; }
      .note { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; fill: #552050; font-size: 14.5px; }
      .foot { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; fill: #6b6672; font-size: 12.5px; }
    </style>
  </defs>

  <rect width="1000" height="560" fill="#FFF8F0"/>

  <text class="h" x="56" y="58" font-size="30">Two lists that behave differently</text>
  <text class="lead" x="56" y="88">Confusing them is why menstrual budgets tend to fail in year two.</text>
  <line x1="56" y1="112" x2="944" y2="112" stroke="#E9DCE6" stroke-width="2"/>

  <!-- Consumables -->
  <rect x="56" y="144" width="430" height="288" rx="18" fill="#ffffff" stroke="#E9DCE6" stroke-width="2"/>
  <rect x="56" y="144" width="430" height="6" rx="3" fill="#E43F8C"/>
  <text class="ct" x="82" y="182" fill="#E43F8C">CONSUMABLES</text>
  <text class="sub" x="82" y="204">Recur every term, forever</text>

  <circle cx="90" cy="238" r="3.5" fill="#E43F8C"/><text class="li" x="104" y="243">Disposable pads for the emergency stock</text>
  <circle cx="90" cy="268" r="3.5" fill="#E43F8C"/><text class="li" x="104" y="273">Soap</text>
  <circle cx="90" cy="298" r="3.5" fill="#E43F8C"/><text class="li" x="104" y="303">Simple pain relief</text>
  <circle cx="90" cy="328" r="3.5" fill="#E43F8C"/><text class="li" x="104" y="333">Replacement reusable kits as they wear out</text>
  <circle cx="90" cy="358" r="3.5" fill="#E43F8C"/><text class="li" x="104" y="363">Bin liners</text>

  <line x1="82" y1="386" x2="460" y2="386" stroke="#E9DCE6" stroke-width="2"/>
  <text class="sub" x="82" y="412">A one-off gift solves one term, then stops.</text>

  <!-- Infrastructure -->
  <rect x="514" y="144" width="430" height="288" rx="18" fill="#ffffff" stroke="#A33895" stroke-width="3"/>
  <rect x="514" y="144" width="430" height="6" rx="3" fill="#A33895"/>
  <text class="ct" x="540" y="182" fill="#A33895">INFRASTRUCTURE</text>
  <text class="sub" x="540" y="204">Bought once, then maintained</text>

  <circle cx="548" cy="238" r="3.5" fill="#A33895"/><text class="li" x="562" y="243">A door, and a latch that works</text>
  <circle cx="548" cy="268" r="3.5" fill="#A33895"/><text class="li" x="562" y="273">Water tank or connection near the latrines</text>
  <circle cx="548" cy="298" r="3.5" fill="#A33895"/><text class="li" x="562" y="303">A partition to make a changing space</text>
  <circle cx="548" cy="328" r="3.5" fill="#A33895"/><text class="li" x="562" y="333">Covered bins, and a private drying line</text>
  <circle cx="548" cy="358" r="3.5" fill="#A33895"/><text class="li" x="562" y="363">Locks and lighting</text>

  <line x1="540" y1="386" x2="918" y2="386" stroke="#E9DCE6" stroke-width="2"/>
  <text class="sub" x="540" y="412">Still there in five years.</text>

  <rect x="56" y="456" width="888" height="56" rx="16" fill="#F6ECF4"/>
  <text class="note" x="500" y="490" text-anchor="middle">A school can usually carry the consumables once the infrastructure exists. Almost never the other way round.</text>

  <text class="foot" x="944" y="540" text-anchor="end">Treasured Vessels Girls&#8217; Centre &#183; treasuredvesselsuganda.org</text>
</svg>
